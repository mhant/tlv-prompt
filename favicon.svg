<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Cyber Cyan / Azure Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12" />

  <!-- Inner Subtle Accent Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.35" />

  <!-- Prompt & Audio Pulse Group with Glow -->
  <g filter="url(#cyanGlow)">
    <!-- Terminal Prompt Chevron (">") -->
    <path d="M 120 160 L 220 256 L 120 352" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Soundwave Equalizer / Audio Pulse Prompt (Blinking Cursor / Broadcast) -->
    <!-- Bar 1 -->
    <line x1="280" y1="200" x2="280" y2="312" stroke="url(#pulseGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Bar 2 (Peak) -->
    <line x1="336" y1="140" x2="336" y2="372" stroke="url(#pulseGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Bar 3 -->
    <line x1="392" y1="180" x2="392" y2="332" stroke="url(#pulseGrad)" stroke-width="32" stroke-linecap="round" />
  </g>

  <!-- High-Tech TLV Subline Accent -->
  <text x="256" y="440" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#94a3b8" 
        text-anchor="middle"
        opacity="0.85">TLV</text>
</svg>
